<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="548" viewBox="0 0 1000 548" role="img" aria-labelledby="title desc">
<title id="title">Dytschgo: three ways into the workflow</title>
<desc id="desc">For an open idea, use Grill, then Spec and Tickets if needed, followed by Engineering or Coordinate when building is requested. For interface work, start directly with Design and explore or build with rendered evidence. For a bug, Engineering uses Debug; Review checks the fix before a merge, and Retro optionally presents the evidence in HTML. These are illustrative conditional routes.</desc>
