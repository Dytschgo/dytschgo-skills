<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Report shell</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--foreground,#e6eef5);font:14px/1.6 system-ui,sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #e5b967;outline-offset:4px}h1{font:700 30px/1.2 Consolas,monospace;margin:12px 0}p{margin:8px 0}.label{font:11px Consolas,monospace;letter-spacing:1px;color:var(--muted-foreground,#a7bac8)}.console{margin-top:18px;padding:20px;border:1px solid #38576b;border-radius:var(--radius,10px);background:#0d1d2b;color:#e6eef5}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button{min-height:44px;padding:10px 13px;background:transparent;border:1px solid #527084;border-radius:4px;color:#e6eef5}button[aria-pressed=true]{border-color:#e5b967;color:#ffd899;background:#2a302c}.console h2{font:700 19px Consolas,monospace;margin:0 0 10px}.console p{color:#b5cbd8}a{color:#87c8ff;overflow-wrap:anywhere}.note{font-size:12px;color:var(--muted-foreground,#a7bac8)}
</style></head><body><div class="label">DYTSCHGO / REPORT SHELL / DEMONSTRATION</div><h1 id="title"></h1><p id="summary"></p><section class="console" aria-label="Report details"><div class="label">INSPECT THE EVIDENCE</div><div class="controls" id="controls"></div><article id="detail" aria-live="polite"></article></section><p class="note">Replace this demonstration content with evidence from the actual task. The shell is a starting asset, not a completed review.</p>
<script>
const report={title:'Example change overview',summary:'Demonstration data only.',items:[{id:'observed',label:'Observed',title:'What was inspected',body:'Identify the artifact, revision, and actual check.'},{id:'expected',label:'Expected',title:'What should improve',body:'Explain the intended benefit separately from measured outcomes.'}]};
if(!getComputedStyle(document.documentElement).getPropertyValue('--background').trim()){document.documentElement.style.background='#101822';document.documentElement.style.colorScheme='dark'}
document.querySelector('#title').textContent=report.title;document.querySelector('#summary').textContent=report.summary;
const controls=document.querySelector('#controls');controls.replaceChildren();
function select(id){const item=report.items.find(i=>i.id===id);controls.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===id)));const detail=document.querySelector('#detail');detail.replaceChildren();const h=document.createElement('h2'),p=document.createElement('p');h.textContent=item.title;p.textContent=item.body;detail.append(h,p)}
for(const item of report.items){const b=document.createElement('button');b.type='button';b.dataset.id=item.id;b.textContent=item.label;b.onclick=()=>select(item.id);controls.appendChild(b)}
select(report.items[0].id);
</script></body></html>
